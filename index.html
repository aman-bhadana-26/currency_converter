<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle">
      <i class="fas fa-moon"></i>
    </button>

    <!-- Main Section -->
    <section id="converter-section" class="section">
      <div class="container">
        <h2>Currency Converter</h2>
        <form>
          <div class="amount">
            <p>Enter Amount</p>
            <input value="1" type="text" />
          </div>
          <div class="dropdown">
            <div class="from">
              <p>From</p>
              <div class="select-container">
                <img src="https://flagsapi.com/US/flat/64.png" />
                <select name="from"></select>
              </div>
            </div>
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <div class="to">
              <p>To</p>
              <div class="select-container">
                <img src="https://flagsapi.com/IN/flat/64.png" />
                <select name="to"></select>
              </div>
            </div>
          </div>
          <div class="msg">1USD = 80INR</div>
          <button>Get Exchange Rate</button>
        </form>
      </div>
    </section>

    <!-- Multi-Currency Comparison Section -->
    <section id="comparison-section" class="section">
      <div class="comparison-container">
        <h2>Multi-Currency Comparison</h2>
        <div class="comparison-controls">
          <div class="base-currency-selector">
            <label>Base Currency</label>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" id="baseFlag" />
              <select id="baseCurrency"></select>
            </div>
          </div>
          <div class="amount-input">
            <label>Amount</label>
            <input type="text" id="comparisonAmount" value="100" />
          </div>
          <button class="compare-btn" id="compareBtn">
            <i class="fas fa-chart-bar"></i> Compare Rates
          </button>
        </div>
        
        <div class="currency-selector-grid">
          <h3>Select currencies to compare (up to 12)</h3>
          <div class="currency-chips" id="currencyChips"></div>
        </div>

        <div class="comparison-results" id="comparisonResults">
          <div class="results-grid" id="resultsGrid"></div>
        </div>
      </div>
    </section>

    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
